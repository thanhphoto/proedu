{% extends 'quiz/base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="error-container p-5 shadow rounded-4 bg-white position-relative overflow-hidden">
                <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(135deg, rgba(220, 53, 69, 0.05) 0%, rgba(220, 53, 69, 0.1) 100%); z-index: 0;"></div>
                <div class="position-relative" style="z-index: 1;">
                    <div class="mb-4">
                        <i class="fas fa-lock text-danger" style="font-size: 5rem; opacity: 0.8;"></i>
                    </div>
                    <h1 class="display-1 fw-bold text-danger mb-0" style="font-size: 6rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">403</h1>
                    <h2 class="h3 mb-4 text-dark fw-semibold">Truy Cập Bị Từ Chối</h2>
                    <p class="lead text-muted mb-5">
                        Xin lỗi, bạn không có quyền để thực hiện hành động này hoặc truy cập vào trang này.<br>
                        {% if exception %}
                            <span class="text-danger mt-2 d-inline-block fw-medium">{{ exception }}</span>
                        {% endif %}
                    </p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="javascript:history.back()" class="btn btn-danger btn-lg px-4 py-2 rounded-pill shadow-sm transition-all hover-scale">
                            <i class="fas fa-arrow-left me-2"></i> Quay lại trang trước
                        </a>
                        <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg px-4 py-2 rounded-pill shadow-sm transition-all">
                            <i class="fas fa-home me-2"></i> Về trang chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .hover-scale:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(220, 53, 69, 0.2)!important;
    }
    .transition-all {
        transition: all 0.3s ease;
    }
    .error-container {
        border-top: 5px solid #dc3545;
    }
</style>
{% endblock %}
